name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build_sdist:
    name: Build source distribution (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build

      - name: Build sdist
        run: |
          python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build manylinux wheels (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: cp39
            abi: cp39
          - python: cp310
            abi: cp310
          - python: cp311
            abi: cp311
          - python: cp312
            abi: cp312

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_SKIP: "*-musllinux* pp* *win* *mac*"
          CIBW_ARCHS_LINUX: "x86_64"
          # Install torch inside cibuildwheel container before compiling bindings
          CIBW_BEFORE_ALL: "pip install torch>=2.0"
          CIBW_TEST_REQUIRES: "torch"
          CIBW_TEST_COMMAND: "python -c \"import torch; from torch_tools import RotaryEmbedding; rope = RotaryEmbedding(64); print('CIBW Smoke Test Passed successfully!')\""

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-wheel-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    name: Publish to PyPI
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
