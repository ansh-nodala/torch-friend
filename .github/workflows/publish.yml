name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build_sdist:
    name: Build source distribution (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels (${{ matrix.os }} / Py ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            python: cp312
          # Windows x86_64
          - os: windows-latest
            python: cp312

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_SKIP: "*-musllinux* pp* *win32* *mac*"
          CIBW_BEFORE_ALL: "pip install torch>=2.0"
          CIBW_TEST_REQUIRES: "torch"
          CIBW_TEST_COMMAND: "python -c \"import torch; from torch_tools import RotaryEmbedding; rope = RotaryEmbedding(64); print('Smoke Test Passed!')\""

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-wheel-${{ matrix.os }}-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    name: Publish to PyPI
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
