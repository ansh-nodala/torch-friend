name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build_sdist:
    name: Build source distribution (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels (${{ matrix.name }} / Py ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # 1. Linux CPU-only Wheel
          - name: linux-cpu
            os: ubuntu-latest
            python: cp312
            use_cuda: "OFF"
            before_all: "pip install torch>=2.0 --index-url https://download.pytorch.org/whl/cpu"

          # 2. Linux CUDA Wheel (Using NVIDIA CUDA 12.1 Development container)
          - name: linux-cuda
            os: ubuntu-latest
            python: cp312
            use_cuda: "ON"
            before_all: "pip install torch>=2.0 --index-url https://download.pytorch.org/whl/cu121"

          # 3. Windows Wheel (CPU / CUDA compatible via PyTorch libs)
          - name: windows
            os: windows-latest
            python: cp312
            use_cuda: "OFF"
            before_all: "pip install torch>=2.0"

    steps:
      - uses: actions/checkout@v4

      # For Linux CUDA build, use NVIDIA's official container image via cibuildwheel
      - name: Set manylinux image for CUDA
        if: matrix.use_cuda == 'ON'
        run: |
          echo "CIBW_MANYLINUX_X86_64_IMAGE=nvidia/cuda:12.1.0-devel-ubuntu22.04" >> $GITHUB_ENV

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_SKIP: "*-musllinux* pp* *win32* *mac*"
          CIBW_BEFORE_ALL: "${{ matrix.before_all }}"
          CIBW_ENVIRONMENT: "USE_CUDA=${{ matrix.use_cuda }}"
          CIBW_TEST_REQUIRES: "torch"
          CIBW_TEST_COMMAND: "python -c \"import torch; from torch_tools import RotaryEmbedding; rope = RotaryEmbedding(64); print('Smoke Test Passed!')\""

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-wheel-${{ matrix.name }}-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    name: Publish to PyPI
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
